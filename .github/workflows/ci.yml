name: CI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    name: Build and Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      # 托盘（getlantern/systray linux 版）CGO 编译需系统库；ubuntu-latest 预装版缺失
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev

      - name: Build Frontend Web App
        run: |
          cd web
          npm ci
          npm run build
          npm run guard

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      # ubuntu 默认 CGO_ENABLED=1 → 编译 native_ocr_linux_amd64（//go:embed 需资产）。
      # 下载 linux amd64 onnxruntime 使 embed 满足；linux/arm64 单测不需要（Go 只编本机 arch）。
      - name: Download onnxruntime asset (linux-amd64)
        run: |
          bash backend/scripts/fetch-onnxruntime.sh linux amd64

      - name: Run Backend Unit Tests
        run: |
          cd backend
          # Windows 宿主下 api/zhidao 登录链路测试偶发 httptest 连接 flake（127.0.0.1
          # 回环 TIME_WAIT 队列争抢，多轮持续出现）。失败自动重跑一次
          # 吸收瞬时 flake——两条命令都强制 -count=1（缓存键一致，重跑侧真实执行，
          # 不被 (cached) 羽化；首条必须带 count=1，否则重跑会被缓存伪绿）。
          go test -p 1 -count=1 -v ./... || go test -p 1 -count=1 -v ./...

      - name: Verify Backend Single-Binary Compilation
        run: |
          cd backend
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o xuanke-ci-check .

      - name: Verify Linux Cross-Compilation
        run: |
          cd backend
          GOOS=linux CGO_ENABLED=0 go build -o /dev/null .

      - name: Verify macOS Cross-Compilation
        run: |
          cd backend
          GOOS=darwin CGO_ENABLED=0 go build -o /dev/null .

  # ============ Windows：验证内嵌原生 ddddocr（CGO=1）单二进制可编译 ============
  ci-windows:
    name: Windows CGO Build Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Frontend Web App
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      # onnxruntime dll 不入 git，构建时下载 + cache（同平台二次构建免下载）
      - name: Cache onnxruntime dll (windows-amd64)
        uses: actions/cache@v4
        with:
          path: backend/internal/zhidao/assets/onnxruntime_win_amd64.dll
          key: onnx-win-amd64-v1.25.0-${{ runner.os }}

      - name: Download onnxruntime dll (windows-amd64)
        shell: pwsh
        run: |
          cd backend
          if (-not (Test-Path internal/zhidao/assets/onnxruntime_win_amd64.dll)) {
            curl.exe -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.25.0/onnxruntime-win-x64-1.25.0.zip
            tar -xf ort.zip
            Copy-Item onnxruntime-win-x64-1.25.0/lib/onnxruntime.dll internal/zhidao/assets/onnxruntime_win_amd64.dll
            Remove-Item ort.zip, onnxruntime-win-x64-1.25.0 -Recurse -Force
          }

      - name: Verify Windows Single-Binary with Embedded ddddocr (CGO=1)
        shell: pwsh
        run: |
          cd backend
          $env:CGO_ENABLED = '1'
          go build -v -ldflags="-s -w -H windowsgui" -o xuanke-ci-check.exe .

  # ============ Windows ARM64：验证内嵌原生 ddddocr（CGO=1）arm64 可编译 ============
  ci-windows-arm64:
    name: Windows ARM64 CGO Build Check
    runs-on: windows-11-arm        # 原生 ARM64 runner；无 gnu ABI 交叉编译器，需装 llvm-mingw
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Frontend Web App
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      # windows-11-arm 不自带 gnu-ABI aarch64 C 工具链（Go cgo 需要）；预装的 clang 是
      # aarch64-pc-windows-msvc（Go 不支持），mingw gcc 是 x86_64。装 pinned llvm-mingw
      # （提供 aarch64-w64-mingw32-clang + lld），并设 CC/CXX——否则 gcc_arm64.S 被
      # x86 汇编器解析报 "no such instruction: stp"（Go 官方 + 多仓库实证）。
      - name: Install llvm-mingw (Windows ARM64)
        shell: pwsh
        run: |
          $ver = "20240619"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\
          Add-Content -Path $env:GITHUB_PATH -Value "C:\llvm-mingw-$ver-ucrt-aarch64\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "CC=aarch64-w64-mingw32-clang"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=aarch64-w64-mingw32-clang++"

      - name: Cache onnxruntime dll (windows-arm64)
        uses: actions/cache@v4
        with:
          path: backend/internal/zhidao/assets/onnxruntime_win_arm64.dll
          key: onnx-win-arm64-v1.25.0-${{ runner.os }}

      - name: Download onnxruntime dll (windows-arm64)
        shell: pwsh
        run: |
          cd backend
          if (-not (Test-Path internal/zhidao/assets/onnxruntime_win_arm64.dll)) {
            curl.exe -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.25.0/onnxruntime-win-arm64-1.25.0.zip
            tar -xf ort.zip
            Copy-Item onnxruntime-win-arm64-1.25.0/lib/onnxruntime.dll internal/zhidao/assets/onnxruntime_win_arm64.dll
            Remove-Item ort.zip, onnxruntime-win-arm64-1.25.0 -Recurse -Force
          }

      - name: Verify Windows ARM64 Single-Binary with Embedded ddddocr (CGO=1)
        shell: pwsh
        run: |
          cd backend
          $env:CGO_ENABLED = '1'
          go build -v -ldflags="-s -w -H windowsgui" -o xuanke-ci-check-arm64.exe .
