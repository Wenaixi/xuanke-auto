name: CI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    name: Build and Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Frontend Web App
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      - name: Run Backend Unit Tests
        run: |
          cd backend
          # -p 1 单包串行：Windows 宿主下 api/zhidao 两个登录链路测试包偶发 httptest
          # 连接 flake（httptest 127.0.0.1 通路 15s 超时/connectex，R46 MAJOR-46-01）。
          # -p 2（R46 起）显著缓解但未根除（R48 实测 4 轮 2 FAIL）；-p 1 换确定性
          # 优先——CI 合并前单次全量 ~2x 时长可接受，绝不让假红阻断合并。
          go test -p 1 -v ./...

      - name: Verify Backend Single-Binary Compilation
        run: |
          cd backend
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o xuanke-ci-check .

      - name: Verify Linux Cross-Compilation
        run: |
          cd backend
          GOOS=linux CGO_ENABLED=0 go build -o /dev/null .

      - name: Verify macOS Cross-Compilation
        run: |
          cd backend
          GOOS=darwin CGO_ENABLED=0 go build -o /dev/null .

  # ============ Windows：验证内嵌原生 ddddocr（CGO=1）单二进制可编译 ============
  ci-windows:
    name: Windows CGO Build Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      - name: Verify Windows Single-Binary with Embedded ddddocr (CGO=1)
        shell: pwsh
        run: |
          cd backend
          $env:CGO_ENABLED = '1'
          go build -v -ldflags="-s -w -H windowsgui" -o xuanke-ci-check.exe .
