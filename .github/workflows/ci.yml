name: CI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    name: Build and Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Frontend Web App
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      - name: Run Backend Unit Tests
        run: |
          cd backend
          # -p 2 限制并行包数：Windows 宿主下 api/zhidao 两个登录链路测试包偶发
          # httptest 连接 flake（connectex：并行 10 包 + 每包多 httptest server 的
          # 端口/连接队列争抢），-p 2 大幅降并发压力（R46 MAJOR-46-01）。
          go test -p 2 -v ./...

      - name: Verify Backend Single-Binary Compilation
        run: |
          cd backend
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o xuanke-ci-check .

      - name: Verify Linux Cross-Compilation
        run: |
          cd backend
          GOOS=linux CGO_ENABLED=0 go build -o /dev/null .

      - name: Verify macOS Cross-Compilation
        run: |
          cd backend
          GOOS=darwin CGO_ENABLED=0 go build -o /dev/null .

  # ============ Windows：验证内嵌原生 ddddocr（CGO=1）单二进制可编译 ============
  ci-windows:
    name: Windows CGO Build Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      - name: Verify Windows Single-Binary with Embedded ddddocr (CGO=1)
        shell: pwsh
        run: |
          cd backend
          $env:CGO_ENABLED = '1'
          go build -v -ldflags="-s -w -H windowsgui" -o xuanke-ci-check.exe .
