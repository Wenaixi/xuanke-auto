name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============ Windows：内置原生 ddddocr 单二进制（CGO=1，原生嵌入 ONNX 模型） ============
  build-windows:
    name: Build Windows (Embedded ddddocr)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Frontend Web App
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      # onnxruntime dll 不入 git，构建时下载 + cache（同平台二次构建免下载）
      - name: Cache onnxruntime dll (windows-amd64)
        uses: actions/cache@v4
        with:
          path: backend/internal/zhidao/assets/onnxruntime_win_amd64.dll
          key: onnx-win-amd64-v1.25.0-${{ runner.os }}

      - name: Download onnxruntime dll (windows-amd64)
        shell: pwsh
        run: |
          cd backend
          if (-not (Test-Path internal/zhidao/assets/onnxruntime_win_amd64.dll)) {
            curl.exe -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.25.0/onnxruntime-win-x64-1.25.0.zip
            tar -xf ort.zip
            Copy-Item onnxruntime-win-x64-1.25.0/lib/onnxruntime.dll internal/zhidao/assets/onnxruntime_win_amd64.dll
            Remove-Item ort.zip, onnxruntime-win-x64-1.25.0 -Recurse -Force
          }

      - name: Build Windows GUI (CGO=1, native embedded ddddocr)
        shell: pwsh
        run: |
          cd backend
          $env:CGO_ENABLED = '1'
          go build -ldflags="-s -w -H windowsgui" -o ../dist-release/xuanke-windows-amd64.exe .

      - name: Build Windows Console (CGO=1, native embedded ddddocr)
        shell: pwsh
        run: |
          cd backend
          $env:CGO_ENABLED = '1'
          go build -ldflags="-s -w" -o ../dist-release/xuanke-windows-amd64-console.exe .

      - name: Package Windows Archives
        shell: pwsh
        run: |
          cd dist-release
          $TAG = "$env:GITHUB_REF_NAME"
          # 配置说明模板：多行 here-string 里的 XUANKE_*= 行会被 YAML 解析器误当 mapping，
          # 必须用单行字符串写入（每行末尾分号）。
          $tpl = ("# 至道选课自动化 - 环境配置文件模板`n" +
                  "# 1. 必填项：管理员访问口令`n" +
                  "XUANKE_ADMIN_TOKEN=your_secure_admin_token_here`n" +
                  "# 2. 可选：OpenAI 兼容视觉 API Key（教务登录验证码识别）`n" +
                  "# SF_API_KEY=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx`n" +
                  "# 3. 可选：激活码机制开关（on=启用；off=关闭）`n" +
                  "XUANKE_ACTIVATION=on`n" +
                  "# 4. 可选：验证码识别引擎（ddddocr=内置离线；vision=云识别需填密钥）`n" +
                  "XUANKE_CAPTCHA_ENGINE=ddddocr`n" +
                  "# 5. 可选：服务端口与数据库路径`n" +
                  "# XUANKE_PORT=3091`n" +
                  "# XUANKE_DB=data/xuanke.db`n")
          Set-Content -Encoding utf8 .env.example -Value $tpl

          # 打包 Windows GUI 版
          New-Item -ItemType Directory -Force win-pkg | Out-Null
          Copy-Item xuanke-windows-amd64.exe win-pkg/xuanke.exe
          Copy-Item .env.example win-pkg/.env.example
          Compress-Archive -Path win-pkg/* -DestinationPath "xuanke-${TAG}-windows-amd64.zip" -Force

          # 打包 Windows 控制台版
          New-Item -ItemType Directory -Force win-console-pkg | Out-Null
          Copy-Item xuanke-windows-amd64-console.exe win-console-pkg/xuanke.exe
          Copy-Item .env.example win-console-pkg/.env.example
          Compress-Archive -Path win-console-pkg/* -DestinationPath "xuanke-${TAG}-windows-amd64-console.zip" -Force

          # 上传构建产物供发布 job 汇总（pwsh 无 mkdir -p，须用 New-Item）
          New-Item -ItemType Directory -Force ../dist-artifacts | Out-Null
          Move-Item "xuanke-${TAG}-*.zip" ../dist-artifacts/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist-artifacts/

  # ============ Windows ARM64：内置原生 ddddocr 单二进制（CGO=1） ============
  build-windows-arm64:
    name: Build Windows ARM64 (Embedded ddddocr)
    runs-on: windows-11-arm        # 原生 ARM64 runner；不可用则改用 windows-latest + zig 交叉
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Frontend Web App
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      # windows-11-arm 不自带 gnu-ABI aarch64 C 工具链（Go cgo 需要）；预装 clang 是
      # aarch64-pc-windows-msvc（Go 不支持）。装 pinned llvm-mingw 并设 CC/CXX。
      - name: Install llvm-mingw (Windows ARM64)
        shell: pwsh
        run: |
          $ver = "20240619"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\
          Add-Content -Path $env:GITHUB_PATH -Value "C:\llvm-mingw-$ver-ucrt-aarch64\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "CC=aarch64-w64-mingw32-clang"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=aarch64-w64-mingw32-clang++"

      - name: Cache onnxruntime dll (windows-arm64)
        uses: actions/cache@v4
        with:
          path: backend/internal/zhidao/assets/onnxruntime_win_arm64.dll
          key: onnx-win-arm64-v1.25.0-${{ runner.os }}

      - name: Download onnxruntime dll (windows-arm64)
        shell: pwsh
        run: |
          cd backend
          if (-not (Test-Path internal/zhidao/assets/onnxruntime_win_arm64.dll)) {
            curl.exe -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.25.0/onnxruntime-win-arm64-1.25.0.zip
            tar -xf ort.zip
            Copy-Item onnxruntime-win-arm64-1.25.0/lib/onnxruntime.dll internal/zhidao/assets/onnxruntime_win_arm64.dll
            Remove-Item ort.zip, onnxruntime-win-arm64-1.25.0 -Recurse -Force
          }

      - name: Build Windows ARM64 GUI (CGO=1, native embedded ddddocr)
        shell: pwsh
        run: |
          cd backend
          $env:CGO_ENABLED = '1'
          go build -ldflags="-s -w -H windowsgui" -o ../dist-release/xuanke-windows-arm64.exe .

      - name: Build Windows ARM64 Console (CGO=1, native embedded ddddocr)
        shell: pwsh
        run: |
          cd backend
          $env:CGO_ENABLED = '1'
          go build -ldflags="-s -w" -o ../dist-release/xuanke-windows-arm64-console.exe .

      - name: Package Windows ARM64 Archives
        shell: pwsh
        run: |
          cd dist-release
          $TAG = "$env:GITHUB_REF_NAME"
          # 配置说明模板：多行 here-string 里的 XUANKE_*= 行会被 YAML 解析器误当 mapping，
          # 必须用单行字符串写入（每行末尾分号）；与 amd64 同款内容。
          $tpl = ("# 至道选课自动化 - 环境配置文件模板`n" +
                  "# 1. 必填项：管理员访问口令`n" +
                  "XUANKE_ADMIN_TOKEN=your_secure_admin_token_here`n" +
                  "# 2. 可选：OpenAI 兼容视觉 API Key（教务登录验证码识别）`n" +
                  "# SF_API_KEY=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx`n" +
                  "# 3. 可选：激活码机制开关（on=启用；off=关闭）`n" +
                  "XUANKE_ACTIVATION=on`n" +
                  "# 4. 可选：验证码识别引擎（ddddocr=内置离线；vision=云识别需填密钥）`n" +
                  "XUANKE_CAPTCHA_ENGINE=ddddocr`n" +
                  "# 5. 可选：服务端口与数据库路径`n" +
                  "# XUANKE_PORT=3091`n" +
                  "# XUANKE_DB=data/xuanke.db`n")
          Set-Content -Encoding utf8 .env.example -Value $tpl

          New-Item -ItemType Directory -Force win-arm-pkg | Out-Null
          Copy-Item xuanke-windows-arm64.exe win-arm-pkg/xuanke.exe
          Copy-Item .env.example win-arm-pkg/.env.example
          Compress-Archive -Path win-arm-pkg/* -DestinationPath "xuanke-${TAG}-windows-arm64.zip" -Force

          New-Item -ItemType Directory -Force win-arm-console-pkg | Out-Null
          Copy-Item xuanke-windows-arm64-console.exe win-arm-console-pkg/xuanke.exe
          Copy-Item .env.example win-arm-console-pkg/.env.example
          Compress-Archive -Path win-arm-console-pkg/* -DestinationPath "xuanke-${TAG}-windows-arm64-console.zip" -Force

          New-Item -ItemType Directory -Force ../dist-artifacts | Out-Null
          Move-Item "xuanke-${TAG}-windows-arm64*.zip" ../dist-artifacts/

      - name: Upload Windows ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-binaries
          path: dist-artifacts/

  # ============ Linux / macOS：纯 Go 交叉编译（CGO=0，stub 回退 Python/Vision） ============
  build-unix:
    name: Build Linux / macOS (Pure Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Frontend Web App
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          cache-dependency-path: 'backend/go.sum'

      # Linux/macOS 内置 go-ddddocr（CGO=1）——需交叉工具链与各平台 onnxruntime 资产
      - name: Install Linux GUI deps + cross compilers
        run: |
          # 托盘（getlantern/systray linux 版）CGO 编译需系统库；ubuntu-24.04 预装版缺 appindicator
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev
          # darwin/linux-arm64 交叉：zig cc 提供 aarch64-macos / aarch64-linux-gnu 目标（无需 apt gcc / osxcross，轻量可靠）
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Download onnxruntime assets (linux/macOS)
        run: |
          bash backend/scripts/fetch-onnxruntime.sh linux amd64
          bash backend/scripts/fetch-onnxruntime.sh linux arm64
          bash backend/scripts/fetch-onnxruntime.sh darwin arm64

      - name: Build Linux AMD64 (CGO=1, embedded ddddocr)
        run: |
          cd backend
          # -tags notray：服务器版无桌面托盘（systray 需 GTK3，交叉/服务器构建负担）
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags notray -ldflags="-s -w" -o ../dist-release/xuanke-linux-amd64 .

      - name: Build Linux ARM64 (CGO=1, embedded ddddocr)
        run: |
          cd backend
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-gnu" go build -tags notray -ldflags="-s -w" -o ../dist-release/xuanke-linux-arm64 .

      - name: Build macOS ARM64 (CGO=0, no embedded ddddocr)
        run: |
          cd backend
          # macOS 双架构统一 CGO=0 纯 Go：zig cc 交叉 darwin 不稳定（onnxruntime_go
          # darwin 分支编 CoreML provider 头 → 'unable to create compilation: AccessDenied'，
          # zig 0.13 在 darwin 目标上的临时目录/缓存权限问题，与 notray 无关——systray 已排除）。
          # 务实决策：macOS 为次要桌面平台，先保发布流水线确定性，识别走云端视觉/Vision 兜底；
          # 待有真 mac runner 或 osxcross 再补内置 go-ddddocr（Linux 全平台已 CGO=1 内置）。
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist-release/xuanke-darwin-arm64 .

      - name: Build macOS AMD64 (CGO=0, no embedded ddddocr)
        run: |
          cd backend
          # macOS x64 已停发 onnxruntime（Microsoft 停 macOS x86_64），保持 CGO=0 纯 Go
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist-release/xuanke-darwin-amd64 .

      - name: Package Unix Archives
        run: |
          cd dist-release
          TAG_NAME="${{ github.ref_name }}"

          cat << 'EOF' > .env.example
          # 抢课系统数据配置文件模板（生产部署时请放入 data/.env）
          # 1. 必填项：管理员访问口令（用于进入管理后台、生成与分发激活码）
          XUANKE_ADMIN_TOKEN=your_secure_admin_token_here

          # 2. 可选项：OpenAI 兼容视觉 API Key（教务登录验证码识别；Linux/macOS 版无内置引擎时需填写）
          # SF_API_KEY=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

          # 3. 可选项：激活码机制开关（on=启用；off=完全关闭，教务账密登录直接进入）
          XUANKE_ACTIVATION=on

          # 4. 可选项：验证码识别引擎（vision=云识别推荐；ddddocr=需宿主机安装 Python + ddddocr）
          #    识别引擎兜底开关默认关闭（两引擎严格互不回退）；需双向兜底请在管理员后台开启
          XUANKE_CAPTCHA_ENGINE=vision

          # 5. 可选项：服务端口与数据库路径（默认端口 3091，数据库 data/xuanke.db）
          # XUANKE_PORT=3091
          # XUANKE_DB=data/xuanke.db
          EOF

          # 打包 Linux 版
          mkdir -p linux-pkg
          cp xuanke-linux-amd64 linux-pkg/xuanke
          chmod +x linux-pkg/xuanke
          cp .env.example linux-pkg/.env.example
          tar -czvf xuanke-${TAG_NAME}-linux-amd64.tar.gz -C linux-pkg .

          # 打包 Linux ARM64 版
          mkdir -p linux-arm-pkg
          cp xuanke-linux-arm64 linux-arm-pkg/xuanke
          chmod +x linux-arm-pkg/xuanke
          cp .env.example linux-arm-pkg/.env.example
          tar -czvf xuanke-${TAG_NAME}-linux-arm64.tar.gz -C linux-arm-pkg .

          # 打包 macOS ARM64 版
          mkdir -p darwin-arm-pkg
          cp xuanke-darwin-arm64 darwin-arm-pkg/xuanke
          chmod +x darwin-arm-pkg/xuanke
          cp .env.example darwin-arm-pkg/.env.example
          tar -czvf xuanke-${TAG_NAME}-darwin-arm64.tar.gz -C darwin-arm-pkg .

          # 打包 macOS x64 版
          mkdir -p darwin-amd-pkg
          cp xuanke-darwin-amd64 darwin-amd-pkg/xuanke
          chmod +x darwin-amd-pkg/xuanke
          cp .env.example darwin-amd-pkg/.env.example
          tar -czvf xuanke-${TAG_NAME}-darwin-amd64.tar.gz -C darwin-amd-pkg .

          mkdir -p ../dist-artifacts
          mv xuanke-${TAG_NAME}-*.tar.gz ../dist-artifacts/

      - name: Upload Unix Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unix-binaries
          path: dist-artifacts/

  # ============ 汇总产物 + 校验和 + 发布 GitHub Release ============
  release:
    name: Assemble and Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-windows-arm64, build-unix]
    steps:
      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/

      - name: Download Windows ARM64 Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-binaries
          path: dist-release/

      - name: Download Unix Binaries
        uses: actions/download-artifact@v4
        with:
          name: unix-binaries
          path: dist-release/

      - name: Generate Checksums
        run: |
          cd dist-release
          sha256sum xuanke-*.zip xuanke-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/xuanke-*.zip
            dist-release/xuanke-*.tar.gz
            dist-release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
