// 至道选课 Android APK Gradle 配置。
// 与 backend/platform_android.go + java/ 壳配套：Go 引擎编译为 libxuanke.so
// （arm64-v8a）放入 jniLibs，Java 壳 System.loadLibrary 加载。

apply plugin: 'com.android.application'

android {
    namespace 'com.xuanke.android'
    compileSdk 35
    // NDK 版本与 CI 安装的 NDK 26.3.11579264 精确定位（AGP 按 ndkVersion 找 SDK 内 NDK）
    ndkVersion "26.3.11579264"
    // minSdk 26（Android 8.0）：前台服务通知渠道 + 抢课窗口期常驻的最低线
    defaultConfig {
        applicationId "com.xuanke.android"
        minSdk 26
        // 版本号由 CI 从 git tag 注入。**必须用 providers.gradleProperty**：
        // gradle 8.7 + AGP 8.5.2 下 project.findProperty('xxx') 在 defaultConfig
        // 求值阶段返回 null，AGP 抛 IllegalArgumentException: Value is null 且
        // 报的行号正是下一行（--stacktrace 实测）。providers 是 Gradle 官方注入
        // 通道，配置阶段即可读。属性名带 apk 前缀，避开 Project 内置 versionX 遮蔽。
        def apkVerCode = providers.gradleProperty('apkVersionCode').getOrElse('1')
        def apkVerName = providers.gradleProperty('apkVersionName').getOrElse('0.2.0')
        versionCode apkVerCode.toString().toInteger()
        versionName apkVerName.toString()
        ndk {
            // 只发 arm64-v8a（覆盖 99% 真机；emulator x86 不发布，侧载仅 arm64）
            abiFilters 'arm64-v8a'
        }
    }
    // 侧载用 debug 签名：显式定义 signingConfig——AGP 8.5 下引用未声明的
    // signingConfigs.debug 会得到 null，报 "Value is null"（且不会提示是哪一行）。
    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
