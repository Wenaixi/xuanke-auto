// 至道选课 Android APK Gradle 配置。
// 与 backend/platform_android.go + java/ 壳配套：Go 引擎编译为 libxuanke.so
// （arm64-v8a）放入 jniLibs，Java 壳 System.loadLibrary 加载。

apply plugin: 'com.android.application'

android {
    namespace 'com.xuanke.android'
    compileSdk 35
    // NDK 版本与 CI 安装的 NDK 26.3.11579264 精确定位（AGP 按 ndkVersion 找 SDK 内 NDK）
    ndkVersion "26.3.11579264"
    // minSdk 26（Android 8.0）：前台服务通知渠道 + 抢课窗口期常驻的最低线
    defaultConfig {
        applicationId "com.xuanke.android"
        minSdk 26
        // 版本号由 CI 在构建前用 sed 直接改写下面两行（见 release.yml 的
        // CI-VERSION-ANCHOR 段），不走 Gradle 属性注入：gradle 8.7 + AGP 8.5.2 下
        // -P 注入属性在 defaultConfig 求值阶段取到 null（AGP 抛
        // IllegalArgumentException: Value is null，报的行号正是紧邻的 versionCode 行，
        // --stacktrace 实测七轮未中），providers.gradleProperty 同样取到 null。
        // sed 改写绕开 Gradle DSL 求值，是当前工具链下唯一可靠路径。
        versionCode 1
        versionName "0.2.0"
        ndk {
            // 只发 arm64-v8a（覆盖 99% 真机；emulator x86 不发布，侧载仅 arm64）
            abiFilters 'arm64-v8a'
        }
    }
    // 侧载用 debug 签名：显式定义 signingConfig——AGP 8.5 下引用未声明的
    // signingConfigs.debug 会得到 null，报 "Value is null"（且不会提示是哪一行）。
    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
