// 至道选课 Android APK Gradle 配置。
// 与 backend/platform_android.go + java/ 壳配套：Go 引擎编译为 libxuanke.so
// （arm64-v8a）放入 jniLibs，Java 壳 System.loadLibrary 加载。

apply plugin: 'com.android.application'

android {
    namespace 'com.xuanke.android'
    compileSdk 35
    // NDK 版本与 CI 安装的 NDK 26.3.11579264 精确定位（AGP 按 ndkVersion 找 SDK 内 NDK）
    ndkVersion "26.3.11579264"
    // minSdk 26（Android 8.0）：前台服务通知渠道 + 抢课窗口期常驻的最低线
    defaultConfig {
        applicationId "com.xuanke.android"
        minSdk 26
        // 版本号由 CI 从 git tag 注入（-PapkVersionName=0.2.9 -PapkVersionCode=209），
        // 避免硬编码导致所有发布都显示同一个 0.2.0。
        //
        // **属性名必须带 apk 前缀**：Gradle 的 Project 内置了 version/versionName/
        // versionCode 等只读属性（AGP 场景下解析为 null），用 -PversionName 注入
        // 会被内置空值遮蔽，findProperty('versionName') 同样拿到 null，
        // 表现为构建期 "A problem occurred evaluating project ':app'. Value is null"。
        versionCode (project.findProperty('apkVersionCode') ?: 1)
        versionName (project.findProperty('apkVersionName') ?: '0.2.0')
        ndk {
            // 只发 arm64-v8a（覆盖 99% 真机；emulator x86 不发布，侧载仅 arm64）
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // 侧载：debug 签名可安装
        }
    }
}
